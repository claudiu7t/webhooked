services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: webhooked
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dummy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - ./server:/app
    env_file:
      - .server.env
    command: tail -f /dev/null # Keeps the container running indefinitely the server will be started manually from the container terminal (to be updated when going to prod)
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
  nginx_proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data: